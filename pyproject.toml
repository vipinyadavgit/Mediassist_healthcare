[project]
name = "mediassist-healthcare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vipinyadavgit", email = "vipinyadav.git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=2.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "streamlit>=1.40.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=5.0.0",
]

[project.scripts]
mediassist-healthcare = "mediassist_healthcare:main"
mediassist-ingest = "mediassist_healthcare.ingestion:main"
mediassist-embed = "mediassist_healthcare.embeddings:main"
mediassist-rag = "mediassist_healthcare.rag:main"
mediassist-api = "mediassist_healthcare.backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
